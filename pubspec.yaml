name: digital_trade_portal
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  flutter_bloc: ^8.1.1
  bloc: ^8.1.0
  dio: ^5.3.0
  shared_preferences: ^2.0.15
  dropdown_button2: ^2.3.9
  easy_localization: ^3.0.1
  flutter_svg: ^2.0.7
  email_validator: ^2.1.17
  go_router: ^10.0.0
  get_it: ^7.6.0
  image_picker: ^1.0.5
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  pin_code_fields: ^8.0.1
  dartz: ^0.10.1
  fluttertoast: ^8.2.2
  carousel_slider: ^5.1.1
  multi_dropdown: ^3.0.1
  cherry_toast:
  flutter_secure_storage: ^10.0.0
  lottie:
  flutter_rating_bar: ^4.0.1
  url_launcher: ^6.3.1
  firebase_messaging: ^16.0.3
  firebase_core:
  flutter_local_notifications:
  flutter_native_splash: ^2.4.7
  pretty_dio_logger:
  flutter_html: ^3.0.0
  flutter_spinkit: ^5.2.1
  package_info_plus: ^8.3.1


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/auth/
    - lib/core/language/


  fonts:
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans-Black.ttf
        - asset: assets/fonts/DMSans-Bold.ttf
        - asset: assets/fonts/DMSans-ExtraBold.ttf
        - asset: assets/fonts/DMSans-Light.ttf
        - asset: assets/fonts/DMSans-Medium.ttf
        - asset: assets/fonts/DMSans-Regular.ttf
        - asset: assets/fonts/DMSans-SemiBold.ttf
        - asset: assets/fonts/DMSans-Thin.ttf
        - asset: assets/fonts/DMSans-ThinItalic.ttf
    - family: IBMPlex
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
        - asset: assets/fonts/IBMPlexSansArabic-ExtraLight.ttf
        - asset: assets/fonts/IBMPlexSansArabic-Light.ttf
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
        - asset: assets/fonts/IBMPlexSansArabic-Thin.ttf
