name: digital_trade_portal
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  flutter_bloc: ^8.1.1
  bloc: ^8.1.0
  dio: ^5.3.0
  shared_preferences: ^2.0.15
  dropdown_button2: ^2.3.9
  easy_localization: ^3.0.1
  flutter_svg: ^2.0.7
  email_validator: ^2.1.17
  go_router: ^10.0.0
  get_it: ^7.6.0
  image_picker: ^1.0.5
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  pin_code_fields: ^8.0.1
  dartz: ^0.10.1
  fluttertoast: ^8.2.2
  carousel_slider: ^5.1.1
  multi_dropdown: ^3.0.1
  cherry_toast:
  flutter_secure_storage: ^10.0.0
  lottie:
  flutter_rating_bar: ^4.0.1
  url_launcher: ^6.3.1
  firebase_messaging: ^16.0.3
  firebase_core:
  flutter_local_notifications:
  # Live driver position on the tracking screen (custom-token sign-in + RTDB).
  firebase_auth: ^6.5.7
  firebase_database: ^12.4.7
  flutter_native_splash: ^2.4.7
  pretty_dio_logger:
  flutter_html: ^3.0.0
  flutter_spinkit: ^5.2.1
  package_info_plus: ^8.3.1
  intl: any
  # Onboarding documents are commercial registrations and VAT certificates,
  # which are usually PDFs -- image_picker alone cannot reach them.
  file_picker: ^10.3.3
  # The trader shows the driver a QR of the delivery handoff code.
  qr_flutter: ^4.1.0
  # Live driver marker on the delivery tracking screen.
  google_maps_flutter: ^2.14.0
  pdfx: ^2.11.0
  share_plus: ^12.0.2
  path_provider: ^2.1.6
  # "My location" on the branch map picker (one fix, asked on tap only).
  geolocator: ^14.0.2


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/auth/
    - assets/images/general/
    - lib/core/language/


  fonts:
    - family: IBMPlex
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Thin.ttf
          weight: 100
        - asset: assets/fonts/IBMPlexSansArabic-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/IBMPlexSansArabic-Light.ttf
          weight: 300
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
